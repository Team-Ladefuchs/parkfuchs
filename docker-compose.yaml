services:
  pocketbase:
    image: localhost/parkfuchs-pocketbase:${PB_VERSION:-latest}
    build:
      context: ./containers/pocketbase
      args:
        PB_VERSION: ${PB_VERSION:-latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - ./pocketbase-db:/pb_data
      - ./pb_migrations:/pb_migrations:ro
